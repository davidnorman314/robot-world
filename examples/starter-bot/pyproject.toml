[project]
name = "starter-bot"
version = "0.1.0"
description = "A robot that drives in a square. Make it do better."
requires-python = ">=3.12"
dependencies = ["robot-api"]

# Where to get robot-api from: the packages/robot-api folder of the robot-world repo,
# at the release tag David gave you. Change the tag only when he says to.
[tool.uv.sources]
robot-api = { git = "https://github.com/davidnorman314/robot-world.git", subdirectory = "packages/robot-api", tag = "v0.2.0" }

# This is how robot-world finds your robot inside the wheel. Keep exactly one entry.
[project.entry-points."robot_world.robots"]
starter-bot = "starter_bot:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starter_bot"]
