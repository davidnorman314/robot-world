[project]
name = "robot-api"
version = "1.0.0"
description = "The API a robot program uses to see and drive in robot-world"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_api"]
