<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>robot-world</title>
<style>
  :root {
    --bg: #1b1f27;
    --panel: #262b36;
    --text: #e8eaf0;
    --muted: #9aa3b5;
    --accent: #f2c14e;
    --ok: #5cc46a;
    --bad: #e5604f;
    --border: #3a4150;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0 12px 0 0; color: var(--accent); }
  label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
  input, select, button {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
  }
  input#wheel { width: 420px; }
  input#seed { width: 70px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #1b1f27; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.active { border-color: var(--accent); color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }
  #view-column { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #view { flex: 1; min-height: 0; position: relative; }
  #view canvas { display: block; }
  #banner {
    position: absolute; top: 12px; left: 12px;
    padding: 6px 12px; border-radius: 6px;
    background: rgba(0,0,0,0.55); font-size: 14px;
  }
  #banner.success { color: var(--ok); }
  #banner.failure { color: var(--bad); }
  #playback {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--border);
  }
  #scrubber { flex: 1; min-width: 200px; }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 120px; }
  aside {
    width: 420px; display: flex; flex-direction: column; gap: 12px;
    padding: 12px; background: var(--panel); border-left: 1px solid var(--border);
    overflow: hidden;
  }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 6px; }
  #eye {
    width: 384px; height: 288px; image-rendering: pixelated; background: #000;
    border: 1px solid var(--border); border-radius: 4px;
  }
  #eye-label, #pose { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  #messages {
    flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none;
    font-size: 14px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg);
  }
  #messages li { padding: 5px 8px; border-bottom: 1px solid var(--border); color: var(--muted); }
  #messages li.said { color: var(--text); }
  #messages li .t { color: var(--accent); margin-right: 8px; font-variant-numeric: tabular-nums; }
  #error {
    white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    color: var(--bad); background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 8px; max-height: 180px; overflow: auto; display: none;
  }
  .hint { color: var(--muted); font-size: 13px; }
  #world-description {
    flex-basis: 100%; margin: 2px 0 0; font-size: 14px; line-height: 1.4;
    color: var(--text); max-width: 900px;
  }
</style>
<script type="importmap">
{ "imports": { "three": "/static/vendor/three.module.js" } }
</script>
</head>
<body>
<header>
  <h1>robot-world</h1>
  <label>Wheel <input id="wheel" placeholder="path to a .whl file or its dist folder"></label>
  <label>World <select id="world"></select></label>
  <label>Seed <input id="seed" type="number" value="1" min="0"></label>
  <button id="run" class="primary">Run</button>
  <span id="status" class="hint"></span>
  <p id="world-description"></p>
</header>
<main>
  <div id="view-column">
    <div id="view"><div id="banner">Load a wheel and press Run</div></div>
    <div id="playback">
      <button id="play" disabled>Play</button>
      <select id="speed">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
      </select>
      <input id="scrubber" type="range" min="0" max="0" step="0.01" value="0" disabled>
      <span id="time">0.0 s</span>
      <span class="hint">View:</span>
      <button class="view-button active" data-view="top" title="Drag to rotate, wheel to zoom, right-drag to pan">Overview</button>
      <button class="view-button" data-view="chase" title="Above and behind the robot">Behind robot</button>
      <button class="view-button" data-view="first" title="Full-detail version of what the robot's camera sees">Robot camera</button>
      <button id="reset-view" title="Put the overview back above the world">Reset</button>
    </div>
  </div>
  <aside>
    <div>
      <h2>Robot's eye (what the program sees)</h2>
      <canvas id="eye" width="128" height="96"></canvas>
      <div id="eye-label">No picture yet</div>
      <div id="pose"></div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; min-height:0">
      <h2>Messages from robot.say</h2>
      <ul id="messages"></ul>
    </div>
    <pre id="error"></pre>
  </aside>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
