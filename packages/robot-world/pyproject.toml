[project]
name = "robot-world"
version = "0.1.0"
description = "A 3D virtual world where a tracked robot drives around to accomplish goals"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "robot-api",
    "uvicorn>=0.30",
]

[project.scripts]
robot-world = "robot_world.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_world"]
