[project]
name = "robot-world-workspace"
version = "0.0.0"
description = "Workspace root for the robot-world simulator"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/robot-api", "packages/robot-world"]

[tool.uv.sources]
robot-api = { workspace = true }
robot-world = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "robot-api",
    "robot-world",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/robot-api/src", "packages/robot-world/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["packages/robot-api/tests", "packages/robot-world/tests"]

[tool.ruff.lint.isort]
known-first-party = ["robot_api", "robot_world"]
